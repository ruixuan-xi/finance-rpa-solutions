<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财务 RPA 自动化方案</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #FF6B9D, #FF8F6B, #FFB347, #87CEEB, #4ECDC4);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 20px;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* 顶部标题 */
  .header {
    text-align: center;
    margin-bottom: 16px;
    flex-shrink: 0;
  }

  .header .icon-row {
    font-size: 36px;
    margin-bottom: 4px;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .header h1 {
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.15);
    letter-spacing: 2px;
  }

  .header .subtitle {
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    margin-top: 4px;
    letter-spacing: 1px;
  }

  /* 卡片容器 */
  .cards-container {
    display: flex;
    gap: 24px;
    max-width: 1200px;
    width: 100%;
    justify-content: center;
    flex: 1;
    min-height: 0;
  }

  /* 卡片 */
  .card {
    flex: 1;
    min-width: 380px;
    max-width: 560px;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 14px 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.12), 0 4px 16px rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
  }

  .card.card-pink::before {
    background: linear-gradient(90deg, #FF6B9D, #FF8F6B, #FFB347);
  }

  .card.card-blue::before {
    background: linear-gradient(90deg, #4ECDC4, #45B7D1, #87CEEB);
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 28px 80px rgba(0,0,0,0.18), 0 6px 20px rgba(0,0,0,0.08);
  }

  /* 卡片头 */
  .card-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 12px;
    border-radius: 20px;
    letter-spacing: 0.5px;
    width: fit-content;
  }

  .card-pink .card-badge {
    background: linear-gradient(135deg, #FFF0F5, #FFE4E8);
    color: #E84A7A;
  }

  .card-blue .card-badge {
    background: linear-gradient(135deg, #E0F7FA, #E0F2F1);
    color: #00897B;
  }

  .card-icon {
    font-size: 30px;
    margin-bottom: 0;
  }

  .card h2 {
    font-size: 17px;
    font-weight: 700;
    color: #2D3436;
    line-height: 1.3;
  }

  .card h3 {
    font-size: 12px;
    font-weight: 500;
    color: #636E72;
    line-height: 1.4;
  }

  /* 分隔线 */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, #DFE6E9, transparent);
    margin: 0;
  }

  /* 信息区块 */
  .section {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #B2BEC3;
  }

  .section-text {
    font-size: 12px;
    color: #636E72;
    line-height: 1.5;
  }

  /* 流程步骤 */
  .flow-steps {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .flow-step {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 4px 8px;
    border-radius: 8px;
    background: #F8F9FA;
    transition: background 0.2s;
  }

  .flow-step:hover {
    background: #F1F3F5;
  }

  .step-num {
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }

  .card-pink .step-num {
    background: linear-gradient(135deg, #FF6B9D, #FF8F6B);
  }

  .card-blue .step-num {
    background: linear-gradient(135deg, #4ECDC4, #45B7D1);
  }

  .step-content {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .step-title {
    font-size: 11px;
    font-weight: 600;
    color: #2D3436;
  }

  .step-desc {
    font-size: 10px;
    color: #B2BEC3;
  }

  .step-auto {
    font-size: 9px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 8px;
    background: #E8F5E9;
    color: #2E7D32;
    width: fit-content;
    margin-top: 2px;
  }

  .step-manual {
    font-size: 9px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 8px;
    background: #FFF3E0;
    color: #E65100;
    width: fit-content;
    margin-top: 2px;
  }

  /* 数据指标 */
  .metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
  }

  .metric-item {
    background: #F8F9FA;
    border-radius: 8px;
    padding: 6px;
    text-align: center;
  }

  .metric-value {
    font-size: 16px;
    font-weight: 800;
    color: #2D3436;
  }

  .metric-label {
    font-size: 10px;
    color: #B2BEC3;
    margin-top: 0;
  }

  .card-pink .metric-value { color: #E84A7A; }
  .card-blue .metric-value { color: #00897B; }

  /* 按钮 */
  .card-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 18px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    color: #fff;
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 0.5px;
    margin-top: auto;
    flex-shrink: 0;
  }

  .card-pink .card-btn {
    background: linear-gradient(135deg, #FF6B9D, #FF8F6B);
  }

  .card-blue .card-btn {
    background: linear-gradient(135deg, #4ECDC4, #45B7D1);
  }

  .card-btn:hover {
    transform: scale(1.03);
    box-shadow: 0 6px 24px rgba(0,0,0,0.15);
  }

  .card-btn svg {
    width: 18px; height: 18px;
  }

  /* 页脚 */
  .footer {
    margin-top: 8px;
    text-align: center;
    color: rgba(255,255,255,0.6);
    font-size: 11px;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  /* 响应式 */
  @media (max-width: 850px) {
    .cards-container {
      flex-direction: column;
      align-items: center;
    }
    .card {
      min-width: unset;
      max-width: 100%;
      width: 100%;
    }
    .header h1 {
      font-size: 26px;
    }
  }
</style>
</head>
<body>

<!-- 顶部 -->
<div class="header">
  <div class="icon-row">💼⚡</div>
  <h1>财务 RPA 自动化方案</h1>
  <p class="subtitle">影刀 RPA + AI · 降本增效 · 端到端自动化</p>
</div>

<!-- 卡片区域（由 content/solutions.json 动态渲染） -->
<div class="cards-container" id="cards"></div>

<div class="footer">
  Powered by 影刀RPA · 财务自动化解决方案 · 2026
</div>

<script>
  var STEP_LABEL = { auto: "🤖 自动执行", manual: "👤 人工操作" };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function renderCard(s) {
    var steps = (s.steps || []).map(function (st, idx) {
      var mode = st.mode || 'auto';
      return '<div class="flow-step">' +
        '<div class="step-num">' + (idx + 1) + '</div>' +
        '<div class="step-content">' +
          '<span class="step-title">' + esc(st.title) + '</span>' +
          '<span class="step-desc">' + esc(st.desc) + '</span>' +
          '<span class="step-' + esc(mode) + '">' + esc(STEP_LABEL[mode] || '🤖 自动执行') + '</span>' +
        '</div>' +
      '</div>';
    }).join('');
    var metrics = (s.metrics || []).map(function (m) {
      return '<div class="metric-item">' +
        '<div class="metric-value">' + esc(m.value) + '</div>' +
        '<div class="metric-label">' + esc(m.label) + '</div>' +
      '</div>';
    }).join('');
    return '<div class="card card-' + (s.theme || 'pink') + '">' +
      '<div style="display:flex;align-items:center;gap:8px;">' +
        '<div class="card-icon">' + esc(s.icon || '💡') + '</div>' +
        '<div>' +
          '<span class="card-badge">' + esc(s.badge) + '</span>' +
          '<h2>' + esc(s.title) + '</h2>' +
          '<h3>' + esc(s.subtitle) + '</h3>' +
        '</div>' +
      '</div>' +
      '<div class="divider"></div>' +
      '<div class="section">' +
        '<span class="section-label">📋 方案背景</span>' +
        '<p class="section-text">' + esc(s.background) + '</p>' +
      '</div>' +
      '<div class="section">' +
        '<span class="section-label">⚙️ 自动化流程</span>' +
        '<div class="flow-steps">' + steps + '</div>' +
      '</div>' +
      '<div class="divider"></div>' +
      '<div class="metrics">' + metrics + '</div>' +
      '<a class="card-btn" href="' + esc(s.buttonUrl) + '" target="_blank">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
        esc(s.buttonText) +
      '</a>' +
    '</div>';
  }
  fetch('content/solutions.json')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var list = (data && data.solutions) || [];
      document.getElementById('cards').innerHTML = list.map(renderCard).join('');
    })
    .catch(function (err) {
      document.getElementById('cards').innerHTML =
        '<p style="color:#fff;text-align:center;">内容加载失败，请稍后刷新。</p>';
      console.error(err);
    });
</script>

</body>
</html>

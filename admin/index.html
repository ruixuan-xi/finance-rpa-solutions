<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内容管理 · 财务RPA方案</title>
  <style>
    @keyframes spin{to{transform:rotate(360deg)}}
    #cms-loading{display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui,-apple-system,sans-serif;color:#555;flex-direction:column;gap:12px}
    #cms-loading .spinner{width:36px;height:36px;border:3px solid #e0e0e0;border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite}
  </style>
  <!-- 使用本地 decap-cms.js，避免 CDN 加载失败 -->
  <script src="./decap-cms.js"></script>
</head>
<body>
  <div id="cms-loading">
    <div class="spinner"></div>
    <p>正在加载管理后台...</p>
  </div>
  <script>
    // CMS 加载完成后隐藏 loading（多种检测方式兜底）
    function hideLoading(){
      var el = document.getElementById('cms-loading');
      if(el) el.style.display = 'none';
    }
    // 方式1：检测 CMS 根容器出现
    var obs = new MutationObserver(function(){
      if(document.querySelector('.cms-app, #cms-root, [class*="CMS_Main"], [class*="cms-root"]')){
        hideLoading(); obs.disconnect();
      }
    });
    obs.observe(document.body,{childList:true,subtree:true});
    // 方式2：监听 CMS 自定义事件
    document.addEventListener('decap-cms-load', hideLoading);
    // 方式3：兜底定时器
    setTimeout(hideLoading, 15000);
  </script>
</body>
</html>

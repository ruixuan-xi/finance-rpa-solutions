<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内容管理 · 财务RPA方案</title>
  <!--
    使用 CMS_MANUAL_INIT 模式，手动初始化以绕过
    Decap CMS 对 .netlify.app 域名的自动检测（它会错误地走 api.netlify.com/auth 代理）。
    手动初始化后认证直接走 GitHub 原生 OAuth。
  -->
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/decap-cms@3/dist/decap-cms.js"></script>
  <script>
    // 手动初始化：从 /admin/config.yml 加载配置，强制使用 github 后端不走 netlify 代理
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'ruixuan-xi/finance-rpa-solutions',
          branch: 'main',
          // 显式声明不使用 Netlify 认证代理，直接走 GitHub OAuth
          auth_endpoint: null,
        },
        media_folder: '/images',
        public_folder: '/images',
        collections: [
          {
            name: 'solutions',
            label: '方案卡片数据',
            files: [
              {
                name: 'solutions-data',
                label: '方案列表',
                file: 'content/solutions.json',
                fields: [
                  { label: '方案列表', name: 'solutions', widget: 'list', fields: [
                    { label: '角标', name: 'badge', widget: 'string' },
                    { label: '图标', name: 'icon', widget: 'string' },
                    { label: '标题', name: 'title', widget: 'string' },
                    { label: '背景描述', name: 'background', widget: 'text' },
                    { label: '流程步骤', name: 'steps', widget: 'list', fields: [
                      { label: '步骤标题', name: 'step_title', widget: 'string' },
                      { label: '步骤内容', name: 'step_content', widget: 'string' }
                    ]},
                    { label: '关键指标', name: 'metrics', widget: 'list', fields: [
                      { label: '指标值', name: 'value', widget: 'string' },
                      { label: '指标说明', name: 'label', widget: 'string' }
                    ]},
                    { label: '按钮文字', name: 'button_text', widget: 'string' },
                    { label: '按钮链接', name: 'button_link', widget: 'string' }
                  ]}
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>

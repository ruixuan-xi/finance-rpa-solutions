<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>内容管理 · 财务RPA方案</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:20px;background:#f5f7fa;color:#333}
.container{max-width:960px;margin:0 auto}
h1{font-size:22px;margin-bottom:8px}
.sub{color:#666;font-size:13px;margin-bottom:24px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{font-size:16px;margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid #eee}
label{display:block;margin-bottom:4px;font-size:13px;color:#555}
input,textarea,select{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:14px;margin-bottom:12px;transition:border .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:#3b82f6}
textarea{min-height:60px;resize:vertical}
.row{display:flex;gap:12px}
.row>div{flex:1}
.steps,.metrics{background:#f8f9fb;border-radius:8px;padding:12px;margin-bottom:12px}
.steps h4,.metrics h4{margin:0 0 10px;font-size:13px;color:#666}
.step-item,.metric-item{background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:10px;margin-bottom:8px;position:relative}
.step-item input,.metric-item input{margin-bottom:6px}
.step-item select{width:auto;padding:6px 24px 6px 8px;margin-bottom:0}
.btn{background:#3b82f6;color:#fff;border:none;padding:10px 18px;border-radius:6px;cursor:pointer;font-size:14px}
.btn:hover{background:#2563eb}
.btn-small{background:#ef4444;color:#fff;border:none;padding:4px 10px;border-radius:4px;font-size:12px;cursor:pointer}
.btn-small:hover{background:#dc2626}
.btn-add{background:#10b981;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:13px;cursor:pointer;margin-top:4px}
.btn-add:hover{background:#059669}
.status{padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:13px;display:none}
.status.ok{background:#dcfce7;color:#166534}
.status.err{background:#fee2e2;color:#991b1b}
.save-bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.token-input{font-family:monospace}
</style>
</head>
<body>
<div class="container">
  <h1>财务RPA方案 · 内容管理</h1>
  <div class="sub">登录后可编辑方案卡片，保存后自动部署到网站</div>
  <div id="status" class="status"></div>

  <div id="loginPanel" class="card">
    <h2>登录 · GitHub 令牌</h2>
    <label>GitHub Personal Access Token <small style="color:#999">(需要 repo 权限，token 仅保存在本机浏览器)</small></label>
    <input type="password" id="tokenInput" class="token-input" placeholder="ghp_xxxxxxxxx" />
    <label>仓库路径 <small style="color:#999">(格式: 用户名/仓库名)</small></label>
    <input type="text" id="repoInput" value="ruixuan-xi/finance-rpa-solutions" />
    <button class="btn" onclick="doLogin()">登录</button>
    <p style="font-size:12px;color:#666;margin-top:10px">
      没有 Token？<a href="https://github.com/settings/tokens/new?description=finance-rpa-cms&scopes=repo" target="_blank">去 GitHub 创建 →</a>
      （勾选 <code>repo</code> 权限，选"无过期时间"）
    </p>
  </div>

  <div id="editor" style="display:none">
    <div class="save-bar" style="margin-bottom:16px">
      <div id="loginInfo" style="font-size:13px;color:#666"></div>
      <div>
        <button class="btn" onclick="saveData()">保存并发布</button>
        <button class="btn" style="background:#64748b;margin-left:8px" onclick="addSolution()">+ 新增方案</button>
      </div>
    </div>
    <div id="solutionsBox"></div>
  </div>
</div>

<script>
const FILE_PATH = 'content/solutions.json';
const BRANCH = 'main';
let token = localStorage.getItem('rpa_cms_token') || '';
let repo = localStorage.getItem('rpa_cms_repo') || 'ruixuan-xi/finance-rpa-solutions';
let data = { solutions: [] };
let sha = null;

function init() {
  if (token) {
    document.getElementById('tokenInput').value = token;
    document.getElementById('repoInput').value = repo;
    doLogin();
  }
}

async function doLogin() {
  token = document.getElementById('tokenInput').value.trim();
  repo = document.getElementById('repoInput').value.trim();
  if (!token) return showStatus('请先输入 GitHub Token', 'err');
  if (!repo.includes('/')) return showStatus('仓库路径格式应为 用户名/仓库名', 'err');

  localStorage.setItem('rpa_cms_token', token);
  localStorage.setItem('rpa_cms_repo', repo);

  showStatus('正在拉取数据...', 'ok');
  try {
    const res = await fetch(`https://api.github.com/repos/${repo}/contents/${FILE_PATH}?ref=${BRANCH}`, {
      headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    const json = await res.json();
    sha = json.sha;
    const decoded = atob(json.content.replace(/\s/g, ''));
    data = JSON.parse(decoded);
    render();
    document.getElementById('loginPanel').style.display = 'none';
    document.getElementById('editor').style.display = '';
    document.getElementById('loginInfo').textContent = `已登录: ${repo}`;
    showStatus('数据加载成功', 'ok');
  } catch(e) {
    showStatus('加载失败: ' + e.message, 'err');
  }
}

function render() {
  const box = document.getElementById('solutionsBox');
  box.innerHTML = '';
  (data.solutions || []).forEach((sol, i) => renderSolutionCard(sol, i));
}

function renderSolutionCard(sol, idx) {
  const div = document.createElement('div');
  div.className = 'card';
  div.dataset.idx = idx;
  div.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>方案 ${idx + 1}: ${sol.title || '(未命名)'}</h2>
      <button class="btn-small" onclick="deleteSolution(${idx})">删除</button>
    </div>
    <div class="row">
      <div><label>主题色</label><select data-field="theme">${makeSelect([{v:'pink',t:'粉(方案一)'},{v:'blue',t:'蓝(方案二)'}], sol.theme)}</select></div>
      <div><label>角标</label><input data-field="badge" value="${esc(sol.badge || '')}" /></div>
      <div><label>图标(emoji)</label><input data-field="icon" value="${esc(sol.icon || '')}" /></div>
    </div>
    <label>标题</label><input data-field="title" value="${esc(sol.title || '')}" />
    <label>副标题</label><input data-field="subtitle" value="${esc(sol.subtitle || '')}" />
    <label>方案背景</label><textarea data-field="background">${esc(sol.background || '')}</textarea>

    <div class="steps">
      <h4>流程步骤</h4>
      <div class="steps-list"></div>
      <button class="btn-add" onclick="addStep(${idx})">+ 添加步骤</button>
    </div>

    <div class="metrics">
      <h4>关键指标</h4>
      <div class="metrics-list"></div>
      <button class="btn-add" onclick="addMetric(${idx})">+ 添加指标</button>
    </div>

    <div class="row">
      <div><label>按钮文字</label><input data-field="buttonText" value="${esc(sol.buttonText || '')}" /></div>
      <div><label>按钮链接</label><input data-field="buttonUrl" value="${esc(sol.buttonUrl || '')}" /></div>
    </div>
  `;
  document.getElementById('solutionsBox').appendChild(div);

  const stepsList = div.querySelector('.steps-list');
  (sol.steps || []).forEach((step, si) => {
    const sdiv = document.createElement('div'); sdiv.className = 'step-item';
    sdiv.innerHTML = `
      <div class="row">
        <div><input data-step-idx="${si}" data-step="title" placeholder="步骤标题" value="${esc(step.title || '')}" /></div>
        <div><input data-step-idx="${si}" data-step="desc" placeholder="步骤描述" value="${esc(step.desc || '')}" /></div>
        <div style="flex:0 0 auto">
          <select data-step-idx="${si}" data-step="mode">${makeSelect([{v:'auto',t:'🤖自动'},{v:'manual',t:'👤人工'}], step.mode)}</select>
          <button class="btn-small" style="margin-left:4px" onclick="this.closest('.step-item').remove()">×</button>
        </div>
      </div>
    `;
    stepsList.appendChild(sdiv);
  });

  const metricsList = div.querySelector('.metrics-list');
  (sol.metrics || []).forEach((m, mi) => {
    const mdiv = document.createElement('div'); mdiv.className = 'metric-item';
    mdiv.innerHTML = `
      <div class="row">
        <div><input data-metric-idx="${mi}" data-metric="value" placeholder="数值(如 ~95%)" value="${esc(m.value || '')}" /></div>
        <div><input data-metric-idx="${mi}" data-metric="label" placeholder="说明(如 效率提升)" value="${esc(m.label || '')}" /></div>
        <div style="flex:0 0 auto"><button class="btn-small" onclick="this.closest('.metric-item').remove()">×</button></div>
      </div>
    `;
    metricsList.appendChild(mdiv);
  });
}

function addSolution() {
  data.solutions.push({ theme:'pink', badge:'新方案', icon:'🆕', title:'', subtitle:'', background:'', steps:[], metrics:[], buttonText:'了解详情', buttonUrl:'' });
  render();
}
function deleteSolution(i) { if(confirm('确定删除方案'+(i+1)+'吗?')){ data.solutions.splice(i,1); render(); } }
function addStep(idx) {
  data.solutions[idx].steps = data.solutions[idx].steps || [];
  data.solutions[idx].steps.push({title:'',desc:'',mode:'auto'});
  render();
}
function addMetric(idx) {
  data.solutions[idx].metrics = data.solutions[idx].metrics || [];
  data.solutions[idx].metrics.push({value:'',label:''});
  render();
}

function collect() {
  const cards = document.querySelectorAll('#solutionsBox > .card');
  const out = [];
  cards.forEach(card => {
    const sol = { steps: [], metrics: [] };
    card.querySelectorAll('[data-field]').forEach(el => sol[el.dataset.field] = el.value);
    card.querySelectorAll('.step-item').forEach(sdiv => {
      const step = {};
      sdiv.querySelectorAll('[data-step]').forEach(el => step[el.dataset.step] = el.value);
      sol.steps.push(step);
    });
    card.querySelectorAll('.metric-item').forEach(mdiv => {
      const m = {};
      mdiv.querySelectorAll('[data-metric]').forEach(el => m[el.dataset.metric] = el.value);
      sol.metrics.push(m);
    });
    out.push(sol);
  });
  data.solutions = out;
}

async function saveData() {
  collect();
  showStatus('正在保存...', 'ok');
  try {
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    const payload = { message: 'update: 修改方案卡片数据 via admin', content, branch: BRANCH };
    if (sha) payload.sha = sha;

    const res = await fetch(`https://api.github.com/repos/${repo}/contents/${FILE_PATH}`, {
      method: 'PUT',
      headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    const json = await res.json();
    sha = json.content.sha;
    showStatus('保存成功！约1分钟后网站自动更新', 'ok');
  } catch(e) {
    showStatus('保存失败: ' + e.message, 'err');
  }
}

function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + (type || '');
  el.style.display = 'block';
  if (type === 'ok') setTimeout(() => el.style.display = 'none', 4000);
}
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function makeSelect(opts, sel) {
  return opts.map(o => `<option value="${o.v}" ${o.v===sel?'selected':''}>${o.t}</option>`).join('');
}

init();
</script>
</body>
</html>
